# 실행기를 GitHub Pages에 배포하고, 하루 한 번 원래 사이트의 최신 위치표를 확인해서 바뀌었으면 커밋하고 다시 배포한다.
#
# 처음 한 번만: 저장소 Settings → Pages → Build and deployment → Source를 "GitHub Actions"로 바꾼다.
#
# 배포를 이 워크플로 안에서 하는 이유: 워크플로가 GITHUB_TOKEN으로 푸시한 커밋은
# Pages 빌드도, 다른 워크플로도 일으키지 않는다. 그래서 위치표 커밋과 배포를 한 번에 처리한다.
name: deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 18 * * *'   # 매일 03:23 (한국 시간). 정각은 GitHub이 붐벼서 늦어질 수 있다.
  workflow_dispatch:

permissions:
  contents: write   # 위치표 갱신 커밋
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v6

      - name: 원래 사이트의 최신 위치표 확인
        continue-on-error: true   # 원래 사이트를 못 읽어도 실행기 배포는 계속한다
        run: python3 update_manifest.py

      - name: 바뀐 위치표 커밋
        id: commit
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "위치표 갱신"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 배포 여부 결정
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          CHANGED: ${{ steps.commit.outputs.changed }}
        run: |
          # 예약 실행은 위치표가 바뀐 날만 배포한다. 푸시·수동 실행은 항상 배포한다.
          if [ "$EVENT" != "schedule" ] || [ "$CHANGED" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 배포할 파일만 모으기
        if: steps.decide.outputs.publish == 'true'
        run: |
          mkdir _site
          cp index.html launcher.css launcher.js zip.js sw.js manifest.webmanifest robots.txt icon-*.png _site/
          # 위치표는 아직 못 받았을 수 있다 (없어도 실행기는 배포)
          cp release.json manifest-*.json _site/ 2>/dev/null || true

      - uses: actions/configure-pages@v5
        if: steps.decide.outputs.publish == 'true'

      - uses: actions/upload-pages-artifact@v4
        if: steps.decide.outputs.publish == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
